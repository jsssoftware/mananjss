<mat-card class="mat-elevation-z2">
    <mat-card-header  class="card-container" style="display: flow-root"> 
      <mat-card-title style="width: 50%; float: left;">
        <p>Policy Search Agent Swapping</p>
      </mat-card-title>
     
    </mat-card-header>
    <hr class="hrClass" />
    <mat-card-content>
      <form [formGroup]="agentsearchPolicyForm" autocomplete="off" style="padding-bottom:10px ;"  (ngSubmit)="submit()">
        <div class="row">
          <div class="col-lg-12">
            <mat-radio-group formControlName="verticalId" (change)="onRadioChange($event)">
                <div class="row">
                 
                  <div class="col-lg-2">
                    <mat-radio-button [value]="1" color="primary" [checked]="true" >
                     Motor
                    </mat-radio-button>
                  </div>
                  <div class="col-lg-2">
                    <mat-radio-button [value]="2" color="primary">
                      Retail & Commercial
                    </mat-radio-button>
                  </div>
                </div>
              </mat-radio-group>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-2">
            <label>Control Number</label>
          </div>
          
          <div class="col-lg-2">
            <mat-form-field appearance="outline">
              <input matInput class="control-class-input" formControlName="number">
            </mat-form-field>
          </div>
          <div class="col-lg-2"></div>
          <div class="col-lg-2">
            <label>Customer Name</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field>
              <input type="text" matInput formControlName="customerName" 
                placeholder="Customer Name" />
            </mat-form-field>
          </div>
  
        </div>
      
        <div class="row">
          <div class="col-lg-2">
            <label>Policy Start From Date</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field appearance="fill">
              <input matInput [matDatepicker]="policyStartFromDatePicker" formControlName="policyStartDateFrom_dump">
              <mat-datepicker-toggle matSuffix [for]="policyStartFromDatePicker"></mat-datepicker-toggle>
              <mat-datepicker #policyStartFromDatePicker></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-lg-2">
            <label>Policy Start To Date</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field appearance="fill">
              <input matInput [matDatepicker]="policyStartToDatePicker" formControlName="policyStartDateTo_dump">
              <mat-datepicker-toggle matSuffix [for]="policyStartToDatePicker"></mat-datepicker-toggle>
              <mat-datepicker #policyStartToDatePicker></mat-datepicker>
            </mat-form-field>
          </div>
        </div>
  
        <div class="row">
            <div class="col-lg-2">
              <label>Policy Number</label>
            </div>
            <div class="col-lg-10">
              <mat-form-field>
                <input type="text" matInput formControlName="policyNumber" placeholder="Policy Number" />
              </mat-form-field>
            </div>
          </div>
          
        <div class="row">
          <div class="col-lg-2">
            <label>Insurance Company</label>
          </div>
          <div class="col-lg-10">
            <mat-form-field appearance="fill"> 
              <input type="text" placeholder="Insurance Company" aria-label="Insurance Company" matInput
              formControlName="insuranceCompany" [matAutocomplete]="autoInsuranceCompany">
              <mat-autocomplete autoActiveFirstOption #autoInsuranceCompany="matAutocomplete"
              [displayWith]="getInsuranceCompanyName.bind(this)" >
              <mat-option *ngFor="let insuranceCompany of _filteredInsuranceCompaniesOptions"
                [value]="insuranceCompany.Value">
                {{insuranceCompany.Name}}
              </mat-option>
            </mat-autocomplete>
            </mat-form-field>
          </div>
        </div>
      
  
        <div class="row" *ngIf="isMotor">
          <div class="col-lg-2">
            <label>Registration Number</label>
          </div>
          <div class="col-lg-10">
            <mat-form-field>
              <input type="text" matInput formControlName="registrationNumber" placeholder="Registration Number" />
            </mat-form-field>
          </div>
        </div>
        <div class="row" >
          <div class="col-lg-2">
            <mat-label>POS Name</mat-label>
          </div>
          <div class="col-lg-10">
            <mat-form-field appearance="fill">
              <mat-select formControlName="posNameId">
                <mat-option>Select</mat-option>
                <mat-option *ngFor="let _posData of _posDatas" [value]="_posData.Value">{{_posData.Name}}
                </mat-option>
              </mat-select>                          
            </mat-form-field>
          </div>
        </div>

      
        <div class="row"> 
        
  
  
          <div class="col-sm-1">
            <button type="reset" class="btn-block" mat-raised-button color="accent" (click)="reset()">
              <mat-icon style="font-size: 22px;">refresh</mat-icon> Reset
            </button>
          </div>
  
         
  
          <div  class="col-sm-1">
           
              <button mat-flat-button color="primary" [ngStyle]="{'background-color':  '#fdcb6e'}"  type="submit"  [disabled]="!agentsearchPolicyForm.valid">
               Filter
              </button>
          </div>
   
  
       
        </div>
      </form>
      <div class="row">
        <div class="col-md-12">
          <ngx-datatable
          [rows]="rows"
          [loadingIndicator]="loadingIndicator"
          class='bootstrap material'
          [columnMode]="ColumnMode.force"
          [headerHeight]="50"
          [footerHeight]="50"
          [rowHeight]="50"
          [limit]="20"
          [scrollbarV]="true" 
          [scrollbarH]="true"
          [reorderable]="true"  
          style="height: 500px;"
          [columns]="columns"
          (activate)="onActivate($event)"
          >
          </ngx-datatable>
      </div>
    </div>
