<mat-card class="mat-elevation-z2">
    <mat-card-header  class="card-container" style="display: flow-root"> 
      <mat-card-title style="width: 50%; float: left;">
        <p>REC Report</p>
      </mat-card-title>
     
    </mat-card-header>
    <hr class="hrClass" />
    <mat-card-content>
      <form [formGroup]="recreport" autocomplete="off" style="padding-bottom:10px ;"  (ngSubmit)="submit()">
        <div class="row">
            <div class="col-lg-2">
              <label>Insurance Company</label>
            </div>
            <div class="col-lg-10">
              <mat-form-field appearance="fill"> 
                <input type="text" placeholder="Insurance Company" aria-label="Insurance Company" matInput
                formControlName="insuranceCompanyId" [matAutocomplete]="autoInsuranceCompany">
                <mat-autocomplete autoActiveFirstOption #autoInsuranceCompany="matAutocomplete"
                [displayWith]="getInsuranceCompanyName.bind(this)" >
                <mat-option *ngFor="let insuranceCompany of _filteredInsuranceCompaniesOptions"
                  [value]="insuranceCompany.Value">
                  {{insuranceCompany.Name}}
                </mat-option>
              </mat-autocomplete>
              </mat-form-field>
            </div>
          </div>

     
        <div class="row">
          <div class="col-lg-2">
            <label>Policy Start From Date</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field appearance="fill">
              <input matInput [matDatepicker]="policyStartFromDatePicker" formControlName="policyStartDateFrom_dump">
              <mat-datepicker-toggle matSuffix [for]="policyStartFromDatePicker"></mat-datepicker-toggle>
              <mat-datepicker #policyStartFromDatePicker></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-lg-2">
            <label>Policy Start To Date</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field appearance="fill">
              <input matInput [matDatepicker]="policyStartToDatePicker" formControlName="policyStartDateTo_dump">
              <mat-datepicker-toggle matSuffix [for]="policyStartToDatePicker"></mat-datepicker-toggle>
              <mat-datepicker #policyStartToDatePicker></mat-datepicker>
            </mat-form-field>
          </div>
        </div>
  
        <div class="row">
          <div class="col-lg-12">
            <mat-radio-group formControlName="rECType" >
                <div class="row">
                    <div class="col-lg-2">
                      </div>
                  <div class="col-lg-4">
                    <mat-radio-button [value]="1" color="primary" [checked]="true" >
                    Reg No Missing
                    </mat-radio-button>
                  </div>
                  <div class="col-lg-4">
                    <mat-radio-button [value]="2" color="primary">
                      R or E or C Missing
                  </mat-radio-button>
                  </div>
                </div>
              </mat-radio-group>
          </div>
        </div>
    
        <div class="row" >
            <div class="col-lg-2">
              <mat-label>POS Name</mat-label>
            </div>
            <div class="col-lg-10">
              <mat-form-field appearance="fill">
                <mat-select formControlName="posNameId">
                  <mat-option>Select</mat-option>
                  <mat-option *ngFor="let _posData of _posDatas" [value]="_posData.Value">{{_posData.Name}}
                  </mat-option>
                </mat-select>                          
              </mat-form-field>
            </div>
          </div>
        <div class="row" >
            <div class="col-lg-2">
              <mat-label>All InHouse</mat-label>
            </div>
            <div class="col-lg-10">
              <mat-form-field appearance="fill">
                <mat-select formControlName="inhouseId">
                  <mat-option>Select</mat-option>
                  <mat-option *ngFor="let _telecaller of _telecallers" [value]="_telecaller.Value">{{_telecaller.Name}}
                  </mat-option>
                </mat-select>                          
              </mat-form-field>
            </div>
          </div>
        <div class="row" >
            <div class="col-lg-2">
              <mat-label>Refrences</mat-label>
            </div>
            <div class="col-lg-10">
              <mat-form-field appearance="fill">
                <mat-select formControlName="refrenceId">
                  <mat-option>Select</mat-option>
                  <mat-option *ngFor="let _refrence of _refrences" [value]="_refrence.Value">{{_refrence.Name}}
                  </mat-option>
                </mat-select>                          
              </mat-form-field>
            </div>
          </div>
         
  
        <div class="row"> 
          <div class="col-sm-1">
            <button type="reset" class="btn-block" mat-raised-button color="accent" (click)="reset()">
              <mat-icon style="font-size: 22px;">refresh</mat-icon> Reset
            </button>
          </div>
  
          <div  class="col-sm-1">
              <button mat-flat-button color="primary" [ngStyle]="{'background-color':  '#fdcb6e'}"  type="submit"  [disabled]="!recreport.valid">
               Filter
              </button>
          </div>       
          <div  class="col-sm-1">
              <button mat-flat-button color="primary" [ngStyle]="{'background-color':  '#fdcb6e'}"  type="button"  [disabled]="!recreport.valid" (click)="downloadExcel()">
               Download Excel
              </button>
          </div>       
        </div>
      </form>
      <div class="row">
        <div class="col-md-12">
          <ngx-datatable
          [rows]="rows"
          [loadingIndicator]="loadingIndicator"
          class='bootstrap material'
          [columnMode]="ColumnMode.force"
          [headerHeight]="50"
          [footerHeight]="50"
          [rowHeight]="50"
          [limit]="20"
          [scrollbarV]="true" 
          [scrollbarH]="true"
          [reorderable]="true"  
          style="height: 500px;"
          [columns]="columns"
          >
          </ngx-datatable>
      </div>
    </div>
    </mat-card-content>
  </mat-card>
