<mat-card class="mat-elevation-z2">
    <mat-card-header  class="card-container" style="display: flow-root"> 
      <mat-card-title style="width: 50%; float: left;">
        <p>Customer Cluster</p>
      </mat-card-title>
     
    </mat-card-header>
    <hr class="hrClass" />
    <mat-card-content>
      <form [formGroup]="customerclusterform" autocomplete="off" style="padding-bottom:10px ;"  (ngSubmit)="submit()">

        <div class="row">
            <div class="col-lg-2">
                <label>Control Number</label>
              </div>
              
              <div class="col-lg-2">
                <mat-form-field appearance="outline">
                  <input matInput class="control-class-input" formControlName="number">
                </mat-form-field>
              </div>
         <div class="col-lg-2">
            <label>Customer Name</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field>
              <input type="text" matInput formControlName="customerName" 
                placeholder="Customer Name" />
            </mat-form-field>
          </div>
  
        </div>
      
        <div class="row">
          <div class="col-lg-2">
            <label>Customer Code</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field>
                <input type="text" matInput formControlName="customerCode" 
                  placeholder="Customer Code" />
              </mat-form-field>
          </div>
          <div class="col-lg-2">
            <label>Customer Phone No</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field>
                <input type="text" matInput formControlName="customerPhoneNo" 
                  placeholder="Customer Phone No" />
              </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-2">
            <label>Cluster Name</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field>
                <input type="text" matInput formControlName="clusterName" 
                  placeholder="Cluster Name" />
              </mat-form-field>
          </div>
          <div class="col-lg-2">
            <label>Cluster Code</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field>
                <input type="text" matInput formControlName="clusterCode" 
                  placeholder="Cluster Code" />
              </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-2">
            <label>Cluster Phone Number</label>
          </div>
          <div class="col-lg-4">
            <mat-form-field>
                <input type="text" matInput formControlName="clusterPhoneNo" 
                  placeholder="Cluster Phone Number" />
              </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <mat-radio-group formControlName="verticalId" (change)="onRadioChange($event)">
                <div class="row">
                 
                  <div class="col-lg-2">
                    <mat-radio-button [value]="0" color="primary" [checked]="true" >
                     All Vertical
                    </mat-radio-button>
                  </div>
                  <div class="col-lg-2">
                    <mat-radio-button [value]="1" color="primary"  >
                     Motor
                    </mat-radio-button>
                  </div>
                  <div class="col-lg-2">
                    <mat-radio-button [value]="2" color="primary">
                      Retail & Commercial
                    </mat-radio-button>
                  </div>
                </div>
              </mat-radio-group>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <mat-radio-group formControlName="policyActivation" (change)="onActivationRadioChange($event)">
                <div class="row">
                  <div class="col-lg-2">
                    <mat-radio-button [value]="1" color="primary" [checked]="true" >
                     Active Policy
                    </mat-radio-button>
                  </div>
                  <div class="col-lg-2">
                    <mat-radio-button [value]="2" color="primary">
                     Policy Till Date
                    </mat-radio-button>
                  </div>
                </div>
              </mat-radio-group>
          </div>
        </div>
        <div class="row">
            <div class="col-md-3">
                <button mat-flat-button color="primary" [ngStyle]="{'background-color':  '#fdcb6e'}"  type="submit"  [disabled]="!customerclusterform.valid">
                 Filter
                </button>
              </div>
            <div class="col-md-3">
                <button mat-flat-button color="primary" [ngStyle]="{'background-color':  '#fdcb6e'}"  type="button" (click)="downloadExcel()">
                 Download Excel
                </button>
              </div>
            <div class="col-md-3">  
                <button mat-flat-button color="secondary" [ngStyle]="{'background-color':  '#fdcb6e'}"  (click)="reset()" type="button">
                 Reset
                </button>
          </div>
        </div>
      </form>
      <div class="row">
       
        <div class="col-md-12">
          <ngx-datatable
          [rows]="rows"
          [loadingIndicator]="loadingIndicator"
          class='bootstrap material'
          [columnMode]="ColumnMode.force"
          [headerHeight]="50"
          [footerHeight]="50"
          [rowHeight]="50"
          [limit]="20"
          [scrollbarV]="true" 
          [scrollbarH]="true"
          [reorderable]="true"  
          style="height: 500px;"
          [columns]="columns"
          >
          </ngx-datatable>
      </div>
    </div>
 
    </mat-card-content>
  </mat-card>
