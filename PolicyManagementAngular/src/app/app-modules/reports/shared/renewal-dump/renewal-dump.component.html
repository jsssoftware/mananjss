<mat-card class="mat-elevation-z2">
    <mat-card-header class="card-container" style="display: flow-root">
        <mat-card-title style="width: 50%; float: left;">
            <p>Renewal Perfomance Report</p>
        </mat-card-title>
        <mat-card-title style="width: 10%; float: right;">
            <!--         <p><button  class="btn-block" style="background: cadetblue;" mat-raised-button color="blue" (click)="backToMaster()">Back</button></p> 
 -->
        </mat-card-title>
    </mat-card-header>
    <hr class="hrClass" />
    <mat-card-content>
<form [formGroup]="renewaldump" autocomplete="off"  (ngSubmit)="submit()">
    <hr style="margin-top: 0px;" />
    <div class="row">
      <div class="col-lg-12">
        <mat-radio-group formControlName="verticalId" (change)="onRadioChange($event)">
            <div class="row">
             
              <div class="col-lg-2">
                <mat-radio-button [value]="1" color="primary" [checked]="true" >
                 Motor
                </mat-radio-button>
              </div>
              <div class="col-lg-2">
                <mat-radio-button [value]="2" color="primary">
                  Retail & Commercial
                </mat-radio-button>
              </div>
            </div>
          </mat-radio-group>
      </div>
    </div>
    
      <div class="row">
        <div class="col-lg-6">
          <mat-form-field appearance="fill">
              <mat-label>Expiry Date From</mat-label>
              <input matInput [matDatepicker]="ExpiryDateFrom" formControlName="expiryDateFrom_dump">
              <mat-datepicker-toggle matSuffix [for]="ExpiryDateFrom"></mat-datepicker-toggle>
              <mat-datepicker #ExpiryDateFrom></mat-datepicker>
            </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-form-field appearance="fill">
              <mat-label>Expiry Date To</mat-label>
              <input matInput [matDatepicker]="ExpiryDateTo" formControlName="expiryDateTo_dump">
              <mat-datepicker-toggle matSuffix [for]="ExpiryDateTo"></mat-datepicker-toggle>
              <mat-datepicker #ExpiryDateTo></mat-datepicker>
            </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-6">
          <mat-form-field appearance="fill" >
              <mat-label>Insurance Company</mat-label>
              <input type="text"
                 matInput
                formControlName="insuranceCompanyId" [matAutocomplete]="autoInsuranceCompany">
              <mat-autocomplete autoActiveFirstOption #autoInsuranceCompany="matAutocomplete"
                [displayWith]="getInsuranceCompanyName.bind(this)" >
                <mat-option *ngFor="let insuranceCompany of _filteredInsuranceCompaniesOptions"
                  [value]="insuranceCompany.Value">
                  {{insuranceCompany.Name}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
      </div>  
      <div class="row">
        <div class="col-lg-2">
            <button type="submit" class="btn-block" mat-raised-button color="primary"  >
                <mat-icon style="font-size: 22px;">save</mat-icon>Filter
            </button>
        </div>
        <div class="col-lg-2">
            <button mat-flat-button color="secondary" [ngStyle]="{'background-color':  '#fdcb7e'}"
                (click)="reset()">
                Reset
            </button>
        </div>
    </div>

    <div class="row">

        <div class="col-lg-4">
          <button mat-flat-button color="secondary" [ngStyle]="{'background-color':  '#fdcb6e'}"  (click)="exportexcel()" type="button">
           Export To Excel
          </button>
        </div>
        </div>
        <div class="row">
            <div class="col-md-12">
              <ngx-datatable
              [rows]="rows"
              [loadingIndicator]="loadingIndicator"
              class='bootstrap material'
              [columnMode]="ColumnMode.force"
              [headerHeight]="50"
              [footerHeight]="50"
              [rowHeight]="50"
              [limit]="20"
              [scrollbarV]="true" 
              [scrollbarH]="true"
              [reorderable]="true"  
              style="height: 500px;"
              [columns]="columns">
              </ngx-datatable>
          </div>
        </div>
 </form>
 </mat-card-content>
